<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2c003e">
  <title>🍸 PATUCONSUMOXD CLUB | VIP Access</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Teko:wght@600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       TEMA: PATUCONSUMOXD CLUB (VIVO & ATREVIDO) ⚡
       Estilo: Nightclub, Neón, Vibrante.
    ========================================= */

    :root {
      /* Paleta Vibrante */
      --neon-pink: #ff0099;
      --neon-blue: #00f3ff;   /* Filemoon */
      --neon-orange: #ff6600; /* DoodStream */
      --neon-red: #ff3333;    /* StreamHG */
      --neon-green: #4deeea;  /* Terabox */
      --bg-dark: #12001b;
      
      --glass: rgba(20, 0, 30, 0.7);
      --glass-border: 1px solid rgba(255, 255, 255, 0.2);
      --text-main: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-dark);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite; 
      background-image: linear-gradient(-45deg, #3f0071, #fb2576, #001eff, #7a04eb);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-glow {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, transparent 0%, #000 120%);
      pointer-events: none; z-index: 0;
    }

    .club-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: var(--glass-border);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 0 30px rgba(251, 37, 118, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
      border-top: 3px solid var(--neon-pink);
      border-bottom: 3px solid var(--neon-blue);
    }

    .brand-title {
      font-family: 'Teko', sans-serif;
      font-size: 3rem;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 5px;
      background: linear-gradient(to right, #fff, var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
      letter-spacing: 2px;
    }

    .video-info {
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 25px;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    .video-info span { color: var(--neon-pink); }

    /* --- Botones --- */
    .actions-area { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }

    .btn-club {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 16px 20px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800; font-size: 1rem;
      text-transform: uppercase; text-decoration: none; color: #fff;
      border-radius: 50px;
      transition: transform 0.2s, box-shadow 0.2s;
      overflow: hidden;
      background: rgba(0,0,0,0.4);
      border: 2px solid transparent;
    }

    .btn-club:active { transform: scale(0.97); }

    /* Estilos por Botón */
    
    /* DOODSTREAM (Naranja) */
    #btn-dood { border-color: var(--neon-orange); box-shadow: 0 0 15px rgba(255, 102, 0, 0.2); }
    #btn-dood:hover { background: rgba(255, 102, 0, 0.2); box-shadow: 0 0 25px var(--neon-orange); }
    #btn-dood .icon-left { color: var(--neon-orange); text-shadow: 0 0 5px var(--neon-orange); }

    /* FILEMOON (Azul - Reactivado) */
    #btn-filemoon { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    #btn-filemoon:hover { background: rgba(0, 243, 255, 0.2); box-shadow: 0 0 25px var(--neon-blue); }
    #btn-filemoon .icon-left { color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }

    /* STREAMHG (Rojo) */
    #btn-streamhg { border-color: var(--neon-red); box-shadow: 0 0 15px rgba(255, 51, 51, 0.2); }
    #btn-streamhg:hover { background: rgba(255, 51, 51, 0.2); box-shadow: 0 0 25px var(--neon-red); }
    #btn-streamhg .icon-left { color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }

    /* TERABOX (Verde) */
    #btn-terabox { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(77, 238, 234, 0.2); }
    #btn-terabox:hover { background: rgba(77, 238, 234, 0.2); box-shadow: 0 0 25px var(--neon-green); }
    #btn-terabox .icon-left { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }

    .icon-left { font-size: 1.2rem; margin-right: 10px; }
    .icon-arrow { font-size: 1.2rem; opacity: 0.8; }

    #loading {
      color: var(--neon-blue); font-weight: bold; letter-spacing: 1px;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }

    .hidden { display: none !important; }
    .neon-divider {
      height: 2px; background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
      margin: 25px 0; border: none; box-shadow: 0 0 10px var(--neon-pink);
    }

    h2 {
      font-size: 0.9rem; letter-spacing: 3px; color: #fff;
      text-transform: uppercase; margin-bottom: 20px; font-weight: 700;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }

    /* Redes Sociales Flex */
    .social-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px;
    }
    .social-btn {
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08); border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s;
      color: #fff; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .social-btn:hover {
      border-color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); transform: translateY(-3px);
    }
    .social-btn::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
      opacity: 0; transform: scale(0.5); transition: 0.3s;
    }
    .social-btn:hover::after { opacity: 0.2; transform: scale(1.5); }
    .social-btn svg { width: 24px; height: 24px; fill: currentColor; z-index: 2; }

    .section-label {
      font-size: 0.7rem; color: var(--neon-pink); margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 1px; font-weight: bold;
    }

    /* Catálogo */
    .catalog-container {
      background: rgba(0,0,0,0.3); border-radius: 15px;
      max-height: 250px; overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1); padding: 5px;
    }
    .catalog-link {
      display: flex; align-items: center; padding: 12px 15px;
      margin-bottom: 5px; background: rgba(255,255,255,0.03);
      border-radius: 8px; text-decoration: none; color: #fff;
      font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .catalog-link:hover {
      background: rgba(255,255,255,0.1); border-left: 3px solid var(--neon-blue);
      padding-left: 20px; 
    }
    .link-dot { 
      width: 8px; height: 8px; background: var(--neon-pink); border-radius: 50%;
      margin-right: 12px; box-shadow: 0 0 5px var(--neon-pink);
    }
    .link-text { flex-grow: 1; text-align: left; text-transform: uppercase; letter-spacing: 0.5px; }

    footer {
      margin-top: 30px; font-size: 0.75rem; color: rgba(255,255,255,0.4);
      text-transform: uppercase; letter-spacing: 2px;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 10px; }
  </style>
</head>

  <script>
    const loading = document.getElementById('loading');
    const videoTitle = document.getElementById('video-title');
    const btnStreamhg = document.getElementById('btn-streamhg');
    const btnDood = document.getElementById('btn-dood'); 
    const btnFilemoon = document.getElementById('btn-filemoon'); // Nuevo Boton
    const btnTerabox = document.getElementById('btn-terabox');
    const catalogList = document.getElementById('video-catalog-list');

    const socialLinks = {
      x: "https://x.com/patuconsumoxxd?t=lBK2T6a-4wD-fXKMzQ_Lsg&s=35",
      facebook: "https://www.facebook.com/share/1AUgAT9XC2/",
      instagram: "https://www.instagram.com/mysweetlinks/?igsh=eDhuZHNtOHE4eXdx#",
      whatsapp: "https://whatsapp.com/channel/0029VaUDtFDDp2QCGAzyPB3u",
      tiktok: "https://www.tiktok.com/@patuconsumoxdpacks?is_from_webapp=1&sender_device=pc"
    };

    const telegramChannels = {
      main: "https://t.me/+iQ-eesmcw0VhYzQx",      
      catalog: "https://t.me/patuconsumoxdmenu",   
      tutorial: "https://t.me/tutodescargas" 
    };

    function populateCommunityLinks() {
      document.getElementById('link-telegram-main').href = telegramChannels.main;
      document.getElementById('link-telegram-catalog').href = telegramChannels.catalog;
      document.getElementById('link-telegram-tutorial').href = telegramChannels.tutorial;
      document.getElementById('link-tiktok').href = socialLinks.tiktok;
      document.getElementById('link-whatsapp').href = socialLinks.whatsapp;
      document.getElementById('link-x').href = socialLinks.x;
      document.getElementById('link-facebook').href = socialLinks.facebook;
      document.getElementById('link-instagram').href = socialLinks.instagram;
    }

    function populateVideoCatalog(data) {
      catalogList.innerHTML = '';  
      const allVideos = Object.entries(data).reverse();
      allVideos.forEach(([videoKey, video]) => {
        const link = document.createElement('a');
        link.href = `/${videoKey}`; 
        link.classList.add('catalog-link');
        link.innerHTML = `<span class="link-dot"></span><span class="link-text">${video.title.toUpperCase()}</span>`;
        catalogList.appendChild(link);
      });
    }

    function main() {
      populateCommunityLinks();
      const videoId = window.location.pathname.substring(1);

      fetch('data.json')
        .then(response => {
          if (!response.ok) throw new Error('No se pudo cargar data.json');
          return response.json();
        })
        .then(videoData => {
          populateVideoCatalog(videoData);

          if (videoId === "" || videoId === "index.html") {
            videoTitle.innerHTML = "🔥 SELECCIONA TU CONTENIDO 🔥";
            loading.style.display = 'none';
          } else {
            if (!videoData[videoId]) {
              videoTitle.textContent = "Contenido no disponible";
              loading.textContent = "Selecciona otro enlace abajo";
              return;
            }

            const video = videoData[videoId];
            videoTitle.innerHTML = `<span>DESCARGAR:</span> ${video.title.toUpperCase()}`;
            
            // --- LÓGICA DE DETECCIÓN INTELIGENTE ---
            
            // 1. StreamHG
            if (video.streamhg) {
                btnStreamhg.href = video.streamhg;
                btnStreamhg.classList.remove('hidden');
            }

            // 2. DoodStream (Detecta si existe la clave "doodstream")
            if (video.doodstream) {
                btnDood.href = video.doodstream;
                btnDood.classList.remove('hidden');
            }

            // 3. Filemoon (Detecta si existe la clave "filemoon")
            if (video.filemoon) {
                btnFilemoon.href = video.filemoon;
                btnFilemoon.classList.remove('hidden');
            }

            // 4. Terabox
            if (video.terabox) {
                btnTerabox.href = video.terabox;
                btnTerabox.classList.remove('hidden');
            }

            loading.style.display = 'none';
          }
        })
        .catch(error => {
          console.error("Error:", error);
          loading.style.color = "red";
          loading.innerHTML = "⚠️ ERROR DE SISTEMA: data.json no encontrado";
        });
    }

    document.addEventListener('DOMContentLoaded', main);
  </script>
