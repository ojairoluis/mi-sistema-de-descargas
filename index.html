<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎃 ¡Tu Video de Terror! 🦇</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* --- INICIO: NUEVAS ANIMACIONES --- */
    @keyframes spookyGlow {
      0%, 100% {
        text-shadow: 0 0 10px #FF0000, 0 0 15px #FF6600;
      }
      50% {
        /* Brillo más intenso en la mitad de la animación */
        text-shadow: 0 0 20px #FF0000, 0 0 30px #FF6600, 0 0 40px #FF6600;
      }
    }
    
    @keyframes spookyShake {
      /* Animación de "temblor" para los botones */
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-4px) rotate(1deg); }
      80% { transform: translateX(4px) rotate(-1deg); }
    }
    /* --- FIN: NUEVAS ANIMACIONES --- */

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Segoe UI', sans-serif; 
    }
    body {
      background: linear-gradient(135deg, #331a00, #000000);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background: rgba(10, 0, 0, 0.4);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 100, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 100, 0, 0.2);
    }
    h1 {
      font-family: 'Creepster', cursive;
      font-size: 2.8rem;
      color: #FF6600;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #FF0000, 0 0 15px #FF6600;
      letter-spacing: 2px;
      
      /* --- APLICAMOS ANIMACIÓN DE BRILLO --- */
      animation: spookyGlow 2.5s ease-in-out infinite;
    }

    /* --- INICIO: ESTILO DE TÍTULO DE VIDEO MEJORADO --- */
    .subtitle { 
      font-size: 1.3rem; /* Más grande */
      color: #ffcc00;  /* Naranja/Ámbar pálido */
      margin-bottom: 30px; 
      font-weight: bold; /* Más impacto */
      text-shadow: 0 0 8px rgba(255, 100, 0, 0.7); /* Sombra a juego */
      transition: all 0.3s ease; /* Transición suave */
      min-height: 1.3rem; /* Evita que la página "salte" al cargar */
    }
    /* --- FIN: ESTILO DE TÍTULO DE VIDEO MEJORADO --- */
    
    .btn {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
    }
    
    .filemoon { background: #6a0dad; }
    .streamhg { background: #FF6600; }
    .terabox { background: #8b0000; }

    .btn:hover { 
      /* Sombra de hover más intensa */
      box-shadow: 0 8px 30px rgba(255, 100, 0, 0.6); 
      
      /* --- APLICAMOS ANIMACIÓN DE TEMBLOR --- */
      animation: spookyShake 0.4s ease-in-out;
    }
    
    .loading { 
      color: #aaa; 
      font-style: italic; 
      margin: 20px 0; 
    }
    .footer { 
      margin-top: 40px; 
      font-size: 0.9rem; 
      color: #aaa; 
    }
    .footer a { 
      color: #FF6600; 
      text-decoration: none; 
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎃 ¡Tu Video de Terror! 👻</h1>
    <p class="subtitle" id="video-title">Buscando en la cripta... 🦇</p>

    <a href="#" class="btn filemoon" id="btn-filemoon">🟣 Filemoon</a>
    <a href="#" class="btn streamhg" id="btn-streamhg">🟠 StreamHG</a>
    <a href="#" class="btn terabox" id="btn-terabox">🔴 Terabox</a>

    <p class="loading" id="loading">🕯️ Conjurando enlaces...</p>

    <div class="footer">
      <p>⚠️ Enlaces externos. No alojamos contenido.</p>
      <p>🕷️ Cada clic alimenta a la araña... 🕸️</p>
      <p>© 2025 | <a href="https://linkvertise.com" target="_blank">Linkvertise</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
