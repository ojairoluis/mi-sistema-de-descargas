<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#020202">
  <title>🎆 PatuConsumoXD - Gala 2026 🥂</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       TEMA: MIDNIGHT CHAMPAGNE GALA 2026
       UX/UI: Enfoque en lujo, dinamismo y claridad.
    ========================================= */

    :root {
      /* Paleta de Colores */
      --bg-void: #020202;
      --bg-night-gradient: radial-gradient(circle at 50% 0%, #1a1233 0%, #000000 70%);
      
      --gold-primary: #FFD700;   /* Oro puro */
      --gold-soft: #FCEEB5;      /* Champán */
      --gold-shadow: #8A6E2F;    /* Bronce */
      
      /* Efectos de Cristal */
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: 1px solid rgba(255, 215, 0, 0.2);
      --glass-blur: blur(20px);
      --box-glow: 0 10px 40px -10px rgba(0,0,0,1), 0 0 20px rgba(255, 215, 0, 0.1) inset;
    }

    /* --- Reset y Base --- */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-void);
      background-image: var(--bg-night-gradient);
      color: var(--gold-soft);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; /* Centrado vertical en pantallas grandes */
      padding: 20px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* --- Fondo Animado (Burbujas de Champán) --- */
    #bubbles-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    
    .bubble {
      position: absolute;
      bottom: -20px;
      background: radial-gradient(circle, var(--gold-primary) 10%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp var(--duration) ease-in infinite;
      animation-delay: var(--delay);
      width: var(--size); height: var(--size); left: var(--pos);
      box-shadow: 0 0 10px var(--gold-primary);
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.5; }
      100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
    }

    /* --- Tarjeta Principal (Glassmorphism) --- */
    .main-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px; /* Ancho ideal para lectura móvil */
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 30px;
      padding: 40px 25px;
      box-shadow: var(--box-glow);
      text-align: center;
      /* Animación de entrada */
      animation: fadeUp 0.8s ease-out forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Badge del Año */
    .year-badge {
      display: inline-block;
      background: linear-gradient(45deg, var(--gold-shadow), var(--gold-primary));
      color: #000;
      font-weight: 900;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px var(--gold-shadow);
    }

    /* --- Tipografía --- */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 2.8rem); /* Tipografía responsiva */
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 10px;
      /* Efecto de texto dorado metálico */
      background: linear-gradient(to right, var(--gold-soft), var(--gold-primary), var(--gold-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
    }
    
    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 35px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* --- SECCIÓN DE BOTONES (El arreglo principal) --- */
    .actions-container {
      display: flex;
      flex-direction: column;
      gap: 16px; /* Espacio vital entre botones */
      margin-bottom: 30px;
    }

    .btn-premium {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      text-decoration: none;
      color: white;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Colores y gradientes únicos para cada servicio */
    #btn-filemoon { background: linear-gradient(135deg, #141E30 0%, #243B55 100%); border-color: #4facfe; }
    #btn-streamhg { background: linear-gradient(135deg, #3E0E0E 0%, #6D1212 100%); border-color: #ff4b4b; }
    #btn-terabox  { background: linear-gradient(135deg, #0D2E21 0%, #14523D 100%); border-color: #1de9b6; }

    /* Efecto "Brillo Deslizante" en Hover */
    .btn-premium::after {
      content: '';
      position: absolute;
      top: -50%; left: -60%;
      width: 60px; height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
      transform: rotate(25deg);
      transition: none; /* Se controla con hover */
    }

    .btn-premium:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.1);
      filter: brightness(1.2);
    }
    .btn-premium:hover::after {
      left: 120%;
      transition: left 0.7s ease-in-out;
    }
    .btn-premium:active { transform: scale(0.98); }

    /* --- Estados y Utilidades --- */
    .hidden { display: none !important; }
    
    .loading-state {
      color: var(--gold-primary);
      font-weight: 600;
      letter-spacing: 1px;
      animation: pulseGold 2s infinite ease-in-out;
    }
    @keyframes pulseGold { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px var(--gold-primary); } }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-shadow), transparent);
      border: none;
      margin: 30px 0;
      opacity: 0.5;
    }

    /* --- Sección de Comunidad (Iconos) --- */
    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--gold-soft);
      margin-bottom: 20px;
    }

    .social-wheel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .icon-glass {
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      transition: all 0.3s ease;
    }
    .icon-glass svg { width: 24px; height: 24px; fill: #aaa; transition: 0.3s; }
    
    .icon-glass:hover {
      background: var(--gold-primary);
      box-shadow: 0 0 20px var(--gold-primary);
      transform: rotate(10deg) translateY(-5px); border-color: transparent;
    }
    .icon-glass:hover svg { fill: #000; }

    /* --- Catálogo (Estilo Lista VIP) --- */
    .catalog-container {
      max-height: 300px;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      padding: 5px;
      /* Scrollbar personalizada */
      scrollbar-width: thin;
      scrollbar-color: var(--gold-shadow) transparent;
    }
    .catalog-container::-webkit-scrollbar { width: 6px; }
    .catalog-container::-webkit-scrollbar-thumb { background: var(--gold-shadow); border-radius: 10px; }

    #video-catalog-list { list-style: none; }
    
    .catalog-link {
      display: flex;
      align-items: center;
      padding: 14px 10px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.3s;
      text-align: left;
    }
    .catalog-link:last-child { border-bottom: none; }
    /* Efecto hover en lista */
    .catalog-link:hover {
      background: linear-gradient(90deg, rgba(255,215,0,0.1), transparent);
      color: var(--gold-primary);
      padding-left: 15px; /* Pequeño desplazamiento a la derecha */
    }

    footer {
      margin-top: 30px; font-size: 0.7rem; color: rgba(255,255,255,0.3); letter-spacing: 1px;
    }
  </style>
</head>
