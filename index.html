<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#020202">
  <title>🎆 PatuConsumoXD - Feliz 2026 🥂</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       TEMA: GALA NIGHT 2026
    ========================================= */

    :root {
      --bg-dark: #050505;
      --bg-gradient: radial-gradient(circle at 50% 10%, #1f1430 0%, #000000 80%);
      
      --gold: #FFD700;
      --gold-pale: #FFF8DC;
      --gold-dark: #B8860B;
      
      --glass: rgba(255, 255, 255, 0.04);
      --border: 1px solid rgba(255, 215, 0, 0.15);
      --blur: blur(16px);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--gold-pale);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      overflow-x: hidden;
    }

    /* --- Burbujas de Fondo --- */
    #bubbles-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    
    .bubble {
      position: absolute;
      bottom: -20px;
      background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      animation: rise var(--duration) ease-in infinite;
      animation-delay: var(--delay);
      width: var(--size); height: var(--size); left: var(--pos);
      box-shadow: 0 0 8px var(--gold);
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* --- Tarjeta Principal --- */
    .main-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: var(--border);
      border-radius: 24px;
      padding: 40px 25px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-top: 10px;
    }

    .badge-year {
      display: inline-block;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.3);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      background: linear-gradient(to right, #fff, var(--gold), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 5s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 30px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* --- Acciones y Botones --- */
    .actions-area {
      display: flex;
      flex-direction: column;
      gap: 15px; /* Espaciado cómodo */
      margin-bottom: 30px;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    /* Fondos Metálicos Oscuros */
    #btn-filemoon { background: linear-gradient(135deg, #16222A 0%, #3A6073 100%); border-color: #6DD5FA; }
    #btn-streamhg { background: linear-gradient(135deg, #480000 0%, #800000 100%); border-color: #ff5e5e; }
    #btn-terabox  { background: linear-gradient(135deg, #02111D 0%, #032e27 100%); border-color: #20BDFF; }

    .btn-download:active { transform: scale(0.98); }
    .btn-download:hover { 
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      filter: brightness(1.1);
    }

    .hidden { display: none !important; }
    
    #loading {
      color: var(--gold);
      font-style: italic;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
      border: none;
      margin: 25px 0;
      opacity: 0.5;
    }

    /* --- Comunidad --- */
    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold-pale);
      margin-bottom: 15px;
      font-weight: 600;
    }

    .social-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 45px; height: 45px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.3s;
    }
    .icon-box svg { width: 20px; height: 20px; fill: #bbb; transition: 0.3s; }
    
    .icon-box:hover { background: var(--gold); border-color: var(--gold); transform: translateY(-3px); }
    .icon-box:hover svg { fill: #000; }

    /* --- Catálogo Elegante --- */
    .catalog-wrapper {
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 8px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .catalog-wrapper::-webkit-scrollbar { width: 4px; }
    .catalog-wrapper::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }

    #video-catalog-list { list-style: none; }

    /* Estilos del Item del Catálogo (Corregido) */
    .catalog-link {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      text-decoration: none;
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .catalog-link:last-child { border-bottom: none; }
    
    .link-icon { margin-right: 10px; font-size: 1.1rem; }
    .link-text { font-weight: 500; }
    
    /* La flecha que arreglamos */
    .link-arrow { 
      margin-left: auto; /* Empuja la flecha a la derecha */
      font-size: 1.5rem; 
      color: var(--gold-dark);
      line-height: 0.5;
      opacity: 0.6;
      transition: 0.2s;
    }

    .catalog-link:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .catalog-link:hover .link-arrow { color: var(--gold); transform: translateX(3px); opacity: 1; }

    footer {
      margin-top: 30px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

  </style>
</head>
