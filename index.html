<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#1a0b2e">
  <title>🎆 PatuConsumoXD - Fiesta 2026 🥳</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Righteous&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       TEMA: ELECTRIC NEON PARTY 2026 ⚡
       Objetivo: Cero tristeza, 100% energía.
    ========================================= */

    :root {
      /* Fondo Violeta/Azul Fiesta */
      --bg-deep: #0f0c29;
      --bg-party: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      
      /* Colores Neón */
      --neon-gold: #FFD700;
      --neon-pink: #FF0055;
      --neon-blue: #00F2FF;
      --neon-green: #00FF9D;
      
      /* Cristal Brillante */
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: 1px solid rgba(255, 255, 255, 0.2);
      --blur: blur(20px);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-deep);
      background-image: var(--bg-party);
      background-attachment: fixed; /* Fondo fijo */
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* --- Fondo Animado (Confeti) --- */
    #particles-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    
    .confetti {
      position: absolute;
      width: var(--size); height: var(--size);
      background-color: var(--color);
      top: -10%; left: var(--pos);
      opacity: 0;
      border-radius: 50%; /* Círculos o cuadrados según prefieras */
      animation: fall var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* --- Tarjeta Principal --- */
    .main-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: var(--glass-border);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.3); /* Resplandor violeta */
      text-align: center;
      margin-top: 15px;
      transition: transform 0.3s;
    }

    /* Badge 2026 Brillante */
    .badge-year {
      display: inline-block;
      background: linear-gradient(45deg, var(--neon-pink), var(--neon-gold));
      color: #fff;
      border-radius: 50px;
      padding: 5px 20px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px var(--neon-pink);
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      animation: pulseBadge 2s infinite;
    }
    @keyframes pulseBadge { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* Títulos */
    h1 {
      font-family: 'Righteous', cursive; /* Fuente moderna */
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      /* Texto Gradiente */
      background: linear-gradient(to right, #fff, var(--neon-blue), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.5));
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 30px;
      font-weight: 400;
    }

    /* --- Botones "Jelly" Neón --- */
    .actions-area {
      display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px;
    }

    .btn-party {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 18px;
      font-weight: 800; font-size: 1rem;
      text-transform: uppercase; text-decoration: none; color: #fff;
      border-radius: 16px; border: none;
      transition: all 0.3s ease;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    /* Colores Vibrantes */
    #btn-filemoon { 
      background: linear-gradient(45deg, #00C6FF, #0072FF); 
      box-shadow: 0 4px 20px rgba(0, 198, 255, 0.4);
    }
    #btn-streamhg { 
      background: linear-gradient(45deg, #FF416C, #FF4B2B); 
      box-shadow: 0 4px 20px rgba(255, 65, 108, 0.4);
    }
    #btn-terabox  { 
      background: linear-gradient(45deg, #11998e, #38ef7d); 
      box-shadow: 0 4px 20px rgba(56, 239, 125, 0.4);
    }

    .btn-party:hover { 
      transform: translateY(-4px) scale(1.02);
      filter: brightness(1.1);
    }
    .btn-party:active { transform: scale(0.95); }

    /* Brillo interno animado */
    .btn-party::before {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: 0.5s;
    }
    .btn-party:hover::before { left: 100%; }

    .hidden { display: none !important; }
    
    #loading {
      color: var(--neon-gold); font-weight: bold; margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* --- Comunidad (Iconos Coloridos) --- */
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
      border: none; margin: 25px 0; opacity: 0.7;
    }

    h2 {
      font-family: 'Righteous', cursive;
      font-size: 1.2rem; margin-bottom: 20px;
      color: #fff; text-shadow: 0 0 10px var(--neon-blue);
    }

    .social-row {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
    }

    .icon-box {
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .icon-box svg { width: 24px; height: 24px; fill: #fff; }

    /* Hover "Pop" */
    .icon-box:hover { 
      background: #fff; transform: translateY(-5px); 
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .icon-box:hover svg { fill: var(--bg-deep); }

    /* --- Catálogo (Lista Moderna) --- */
    .catalog-wrapper {
      background: rgba(0,0,0,0.3);
      border-radius: 16px; padding: 10px;
      max-height: 280px; overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
    }
    /* Scrollbar invisible pero funcional */
    .catalog-wrapper::-webkit-scrollbar { width: 0px; }

    #video-catalog-list { list-style: none; }

    .catalog-link {
      display: flex; align-items: center;
      padding: 14px; margin-bottom: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      text-decoration: none; color: #fff;
      font-weight: 600; font-size: 0.9rem;
      transition: 0.2s;
    }
    .catalog-link:last-child { margin-bottom: 0; }
    
    .link-icon { margin-right: 10px; font-size: 1.2rem; }
    .link-text { flex-grow: 1; text-align: left; }
    .link-arrow { color: var(--neon-green); font-weight: bold; font-size: 1.2rem; }

    .catalog-link:hover { 
      background: rgba(255,255,255,0.15); 
      transform: translateX(5px);
      box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
    }

    footer {
      margin-top: 30px; font-size: 0.75rem; color: rgba(255,255,255,0.5);
      font-weight: bold; letter-spacing: 1px;
    }
  </style>
</head>
