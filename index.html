<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎃 ¡Tu Video de Terror! 🦇</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* --- Animaciones Halloween --- */
    @keyframes spookyGlow {
      0%, 100% { text-shadow: 0 0 10px #FF0000, 0 0 15px #FF6600; }
      50% { text-shadow: 0 0 20px #FF0000, 0 0 30px #FF6600, 0 0 40px #FF6600; }
    }
    
    @keyframes spookyShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-4px) rotate(1deg); }
      80% { transform: translateX(4px) rotate(-1deg); }
    }
    
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255,102,0,0.5); }
      50% { box-shadow: 0 0 30px rgba(255,102,0,1); }
    }

    /* --- Estilos Base --- */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Segoe UI', sans-serif; 
    }
    body {
      background: linear-gradient(135deg, #331a00, #000000);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(10, 0, 0, 0.4);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 100, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 100, 0, 0.2);
    }

    /* --- Títulos --- */
    h1 {
      font-family: 'Creepster', cursive;
      font-size: 2.8rem;
      color: #FF6600;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #FF0000, 0 0 15px #FF6600;
      letter-spacing: 2px;
      animation: spookyGlow 2.5s ease-in-out infinite;
    }
    .subtitle { 
      font-size: 1.3rem; 
      color: #ffcc00;  
      margin-bottom: 25px; /* Espacio entre título y divisor */
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 100, 0, 0.7);
      transition: all 0.3s ease;
      min-height: 1.3rem;
      word-wrap: break-word;
    }
    
    /* --- NUEVO: Divisor Profesional --- */
    .spooky-divider {
      border: none;
      height: 1px;
      /* Línea naranja semitransparente que combina */
      background: rgba(255, 100, 0, 0.3);
      width: 80%; /* Más elegante que 100% */
      margin: 0 auto 25px auto; /* 0 arriba, centrado, 25px abajo */
    }
    
    /* --- Estilo Base de Botones (compartido) --- */
    .btn {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
    }
    
    /* --- CTA Primario (Descarga) --- */
    .btn-primary {
      border: none;
      animation: glowPulse 2s ease-in-out infinite;
    }
    .filemoon { background: #6a0dad; }
    .streamhg { background: #FF6600; }
    .terabox { background: #8b0000; }

    .btn-primary:hover { 
      box-shadow: 0 8px 30px rgba(255, 100, 0, 0.6); 
      animation: spookyShake 0.4s ease-in-out;
      animation-play-state: paused;
    }
    
    /* --- CTA Secundario (Telegram) - Estilo "Fantasma" --- */
    .btn-secondary {
      background: transparent;
      border: 3px solid #6a0dad;
      color: #6a0dad;
    }
    .btn-secondary:hover {
      background: #6a0dad;
      color: white;
      box-shadow: 0 0 20px rgba(106, 13, 173, 0.7);
      transform: scale(1.02);
    }
    
    /* --- Varios --- */
    .loading { 
      color: #aaa; 
      font-style: italic; 
      margin: 20px 0; 
    }
    .footer { 
      margin-top: 40px; 
      font-size: 0.9rem; 
      color: #aaa; 
    }
    .footer a { 
      color: #FF6600; 
      text-decoration: none; 
    }

    /* --- Barra de Redes Sociales Profesional --- */
    .social-bar {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #444;
    }
    .social-bar h2 {
      color: #ffcc00;
      margin-bottom: 25px;
      font-size: 1.5rem;
    }
    .social-icons-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .social-icon {
      display: inline-block;
      color: #ddd;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .social-icon:hover {
      background: #FF6600;
      color: white;
      transform: scale(1.1);
    }
    
    /* ============================================================
      OPTIMIZACIÓN MÓVIL (Actualizada)
    ============================================================
    */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      
      h1 {
        font-size: 2.4rem;
      }
      
      .subtitle {
        font-size: 1.1rem;
        margin-bottom: 20px; /* Espacio ajustado para móvil */
      }
      
      /* Eliminamos el estilo del cta-text que ya no existe */
      
      .spooky-divider {
        margin-bottom: 20px; /* Espacio ajustado para móvil */
      }
      
      .btn {
        padding: 15px;
        font-size: 1.1rem;
      }
      
      .social-bar h2 {
        font-size: 1.3rem;
      }
    }
    
  </style>
</head>
<body>

  <div class="container">
    <h1>🎃 ¡Tu Video de Terror! 👻</h1>
    <p class="subtitle" id="video-title">Buscando en la cripta... 🦇</p>

    <hr class="spooky-divider">

    <a href="#" class="btn btn-primary filemoon" id="btn-filemoon">🟣 Filemoon 💀</a>
    <a href="#" class="btn btn-primary streamhg" id="btn-streamhg">🟠 StreamHG 👻</a>
    <a href="#" class="btn btn-primary terabox" id="btn-terabox">🔴 Terabox 🎃</a>

    <p class="loading" id="loading">🕯️ Conjurando enlaces...</p>

    <div class="footer">
      <p>⚠️ Enlaces externos. No alojamos contenido.</p>
      <p>🕷️ Cada clic alimenta a la araña... 🕸️</p>
      <p>© 2025 | <a href="https://linkvertise.com" target="_blank">Linkvertise</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
