<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎃 ¡Tu Video de Terror! 🦇</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* --- Animaciones Halloween --- */
    @keyframes spookyGlow {
      0%, 100% {
        text-shadow: 0 0 10px #FF0000, 0 0 15px #FF6600;
      }
      50% {
        text-shadow: 0 0 20px #FF0000, 0 0 30px #FF6600, 0 0 40px #FF6600;
      }
    }
    
    @keyframes spookyShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-4px) rotate(1deg); }
      80% { transform: translateX(4px) rotate(-1deg); }
    }

    /* --- Estilos Base --- */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Segoe UI', sans-serif; 
    }
    body {
      background: linear-gradient(135deg, #331a00, #000000);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(10, 0, 0, 0.4);
      padding: 25px; /* Optimizado para móviles */
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 100, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 100, 0, 0.2);
    }

    /* --- Títulos --- */
    h1 {
      font-family: 'Creepster', cursive;
      font-size: 2.8rem;
      color: #FF6600;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #FF0000, 0 0 15px #FF6600;
      letter-spacing: 2px;
      animation: spookyGlow 2.5s ease-in-out infinite;
    }
    .subtitle { 
      font-size: 1.3rem; 
      color: #ffcc00;  
      margin-bottom: 30px; 
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 100, 0, 0.7);
      transition: all 0.3s ease;
      min-height: 1.3rem;
      word-wrap: break-word; /* Asegura que títulos largos no rompan el layout */
    }
    
    /* --- Botones --- */
    .btn {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
    }
    
    .filemoon { background: #6a0dad; } /* Púrpura Bruja */
    .streamhg { background: #FF6600; } /* Naranja Calabaza */
    .terabox { background: #8b0000; } /* Rojo Sangre */

    .btn:hover { 
      box-shadow: 0 8px 30px rgba(255, 100, 0, 0.6); 
      animation: spookyShake 0.4s ease-in-out;
    }
    
    /* --- Varios --- */
    .loading { 
      color: #aaa; 
      font-style: italic; 
      margin: 20px 0; 
    }
    .footer { 
      margin-top: 40px; 
      font-size: 0.9rem; 
      color: #aaa; 
    }
    .footer a { 
      color: #FF6600; 
      text-decoration: none; 
    }

    /* --- NUEVA BARRA DE REDES SOCIALES PROFESIONAL --- */
    .social-bar {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #444; /* Separador limpio */
    }
    .social-bar h2 {
      color: #ffcc00; /* Color Ámbar/Naranja */
      margin-bottom: 25px;
      font-size: 1.5rem;
    }
    .social-icons-container {
      display: flex;
      justify-content: center;
      gap: 15px; /* Espacio entre iconos */
      flex-wrap: wrap; /* Súper optimizado para móviles */
    }
    .social-icon {
      display: inline-block;
      color: #ddd;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 50px; /* Estilo "píldora" moderno */
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .social-icon:hover {
      background: #FF6600; /* Naranja Halloween al pasar el mouse */
      color: white;
      transform: scale(1.1); /* Efecto genial */
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎃 ¡Tu Video de Terror! 👻</h1>
    <p class="subtitle" id="video-title">Buscando en la cripta... 🦇</p>

    <a href="#" class="btn filemoon" id="btn-filemoon">🟣 Filemoon</a>
    <a href="#" class="btn streamhg" id="btn-streamhg">🟠 StreamHG</a>
    <a href="#" class="btn terabox" id="btn-terabox">🔴 Terabox</a>

    <p class="loading" id="loading">🕯️ Conjurando enlaces...</p>

    <div class="footer">
      <p>⚠️ Enlaces externos. No alojamos contenido.</p>
      <p>🕷️ Cada clic alimenta a la araña... 🕸️</p>
      <p>© 2025 | <a href="https://linkvertise.com" target="_blank">Linkvertise</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
