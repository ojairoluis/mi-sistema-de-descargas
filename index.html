<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#FFD700">
  <title>🎉 PatuConsumoXD - ¡Fiestón 2026! 🍻</title>
  
  <!-- Fuentes Festivas: 'Bangers' para títulos explosivos, 'Roboto' para lectura clara -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       TEMA: COTILLÓN LATINO 2026 🍻💵🎉
       ¡Alegría, dorado, verde billete y espuma!
    ========================================= */

    :root {
      /* Paleta de Colores Festiva */
      --gold: #FFD700;       /* Dorado brillante */
      --gold-dark: #DAA520;  /* Dorado oscuro */
      --green-money: #228B22; /* Verde billete */
      --red-party: #DC143C;   /* Rojo festivo */
      --beer-foam: #FFFACD;   /* Espuma de cerveza */
      
      /* Fondo de Cerveza */
      --bg-beer: linear-gradient(to bottom, #fbb03b, #ff8c00);

      /* Cristal Festivo */
      --glass: rgba(255, 255, 255, 0.15);
      --glass-border: 2px solid var(--gold);
      --blur: blur(10px);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-beer);
      background-attachment: fixed;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* --- Fondo Animado (Burbujas de Cerveza) --- */
    #beer-bubbles-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
      background-image: radial-gradient(rgba(255, 255, 255, 0.2) 10%, transparent 10%);
      background-size: 20px 20px;
      animation: bubbles-rise 10s linear infinite;
    }

    @keyframes bubbles-rise {
      from { background-position: 0 100%; }
      to { background-position: 0 0; }
    }
    
    /* --- Elementos Flotantes (Confeti y Billetes) --- */
    #particles-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    
    .party-item {
      position: absolute;
      top: -10%;
      opacity: 0.8;
      animation: fall-and-spin var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes fall-and-spin {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* --- Tarjeta Principal --- */
    .main-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: var(--glass-border);
      border-radius: 30px;
      padding: 35px 25px;
      box-shadow: var(--shadow), inset 0 0 20px var(--gold);
      text-align: center;
      margin-top: 15px;
    }

    /* Badge 2026 Festivo */
    .badge-year {
      display: inline-block;
      background: linear-gradient(45deg, var(--green-money), var(--gold), var(--red-party));
      color: #fff;
      border-radius: 50px;
      padding: 8px 25px;
      font-size: 1.1rem;
      font-family: 'Bangers', cursive;
      letter-spacing: 2px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-shadow: 2px 2px 0 #000;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    /* Títulos Explosivos */
    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      margin-bottom: 10px;
      color: var(--gold);
      text-shadow: 3px 3px 0 var(--red-party), 5px 5px 0 #000;
      line-height: 1;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--beer-foam);
      margin-bottom: 30px;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* --- Botones de Fiesta --- */
    .actions-area {
      display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px;
    }

    .btn-fiesta {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 18px;
      font-family: 'Roboto', sans-serif;
      font-weight: 900; font-size: 1.1rem;
      text-transform: uppercase; text-decoration: none; color: #fff;
      border-radius: 50px; border: 3px solid var(--gold);
      transition: all 0.3s ease;
      overflow: hidden;
      box-shadow: 0 6px 0 var(--gold-dark), 0 10px 20px rgba(0,0,0,0.4);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
    }
    
    /* Colores Vibrantes */
    #btn-filemoon { 
      background: linear-gradient(to bottom, #00C6FF, #0072FF); 
    }
    #btn-streamhg { 
      background: linear-gradient(to bottom, var(--red-party), #FF4B2B); 
    }
    #btn-terabox  { 
      background: linear-gradient(to bottom, var(--green-money), #38ef7d); 
    }

    .btn-fiesta:hover { 
      transform: translateY(-4px);
      box-shadow: 0 10px 0 var(--gold-dark), 0 15px 25px rgba(0,0,0,0.5);
    }
    .btn-fiesta:active { 
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--gold-dark), 0 5px 10px rgba(0,0,0,0.4);
    }

    /* Efecto de Brillo */
    .btn-fiesta::before {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      transition: 0.5s;
    }
    .btn-fiesta:hover::before { left: 100%; }

    .hidden { display: none !important; }
    
    #loading {
      color: var(--gold); font-family: 'Bangers', cursive; font-size: 1.2rem; margin-bottom: 15px;
      text-shadow: 2px 2px 0 #000;
    }

    /* --- Comunidad (Iconos Festivos) --- */
    .divider {
      height: 4px;
      background: repeating-linear-gradient(45deg, var(--gold), var(--gold) 10px, var(--red-party) 10px, var(--red-party) 20px);
      border: none; margin: 25px 0;
      border-radius: 2px;
    }

    h2 {
      font-family: 'Bangers', cursive;
      font-size: 1.5rem; margin-bottom: 20px;
      color: var(--gold); text-shadow: 2px 2px 0 var(--red-party);
    }

    .social-row {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
    }

    .icon-box {
      width: 55px; height: 55px;
      display: flex; align-items: center; justify-content: center;
      background: var(--gold);
      border-radius: 50%;
      border: 3px solid var(--red-party);
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 0 var(--red-party);
    }
    .icon-box svg { width: 28px; height: 28px; fill: var(--red-party); }

    /* Hover "Pop" */
    .icon-box:hover { 
      transform: translateY(-5px) scale(1.1); 
      background: var(--green-money);
      border-color: var(--gold);
      box-shadow: 0 8px 0 var(--gold);
    }
    .icon-box:hover svg { fill: var(--gold); }

    /* --- Catálogo (Lista de Brindis) --- */
    .catalog-wrapper {
      background: rgba(0,0,0,0.4);
      border-radius: 20px; padding: 10px;
      max-height: 300px; overflow-y: auto;
      border: 2px solid var(--gold);
    }
    /* Scrollbar dorada */
    .catalog-wrapper::-webkit-scrollbar { width: 8px; }
    .catalog-wrapper::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

    #video-catalog-list { list-style: none; }

    .catalog-link {
      display: flex; align-items: center;
      padding: 12px 15px; margin-bottom: 8px;
      background: rgba(255, 215, 0, 0.2);
      border-radius: 15px;
      text-decoration: none; color: #fff;
      font-weight: 700; font-size: 1rem;
      transition: 0.2s;
      border: 1px solid var(--gold);
    }
    .catalog-link:last-child { margin-bottom: 0; }
    
    .link-icon { margin-right: 10px; font-size: 1.4rem; }
    .link-text { flex-grow: 1; text-align: left; text-shadow: 1px 1px 2px #000; }
    .link-arrow { color: var(--gold); font-family: 'Bangers', cursive; font-size: 1.2rem; }

    .catalog-link:hover { 
      background: var(--green-money);
      transform: scale(1.02);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .catalog-link:hover .link-arrow { color: #fff; }

    footer {
      margin-top: 30px; font-size: 0.8rem; color: var(--beer-foam);
      font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px #000;
    }
  </style>
</head>
